name: Setup CEF
inputs:
  platform:
    required: true
runs:
  using: composite
  steps:
    - name: CEF version
      id: cef
      shell: bash
      run: |
        version=$(cargo metadata --format-version 1 --locked --manifest-path src/Cargo.toml \
          | jq -r 'first(.packages[] | select(.name=="cef") | .version) // error("cannot determine version")')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache CEF
      id: cef-cache
      uses: actions/cache/restore@v6
      with:
        path: .cache/cef
        key: cef-${{ inputs.platform }}-${{ steps.cef.outputs.version }}

    - name: Download CEF
      shell: bash
      run: cargo xtask fetch-cef

    - name: Save prepared CEF
      if: steps.cef-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .cache/cef
        key: ${{ steps.cef-cache.outputs.cache-primary-key }}
