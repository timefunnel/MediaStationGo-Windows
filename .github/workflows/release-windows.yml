name: release-windows

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build-windows run ID to promote
        required: true
        type: string
      release_tag:
        description: Stable release tag, for example v0.1.1
        required: true
        type: string
      publish_rife_component:
        description: Publish the candidate's optional RIFE component as a separate prerelease
        required: false
        default: false
        type: boolean
      replace_existing:
        description: Replace an existing release and move its tag to the verified candidate
        required: false
        default: false
        type: boolean
      release_notes:
        description: Full release notes; required when replacing an existing release
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-windows-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify candidate run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid build run ID: $BUILD_RUN_ID" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable vMAJOR.MINOR.PATCH tag: $RELEASE_TAG" >&2
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          workflow_path="$(jq -r '.path' <<<"$run_json")"
          status="$(jq -r '.status' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          event="$(jq -r '.event' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          head_repository="$(jq -r '.head_repository.full_name' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"

          if [[ "$workflow_path" != ".github/workflows/build-windows.yml" ]]; then
            echo "Run $BUILD_RUN_ID belongs to $workflow_path, not build-windows.yml" >&2
            exit 1
          fi
          if [[ "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "Run $BUILD_RUN_ID was built from $head_repository" >&2
            exit 1
          fi
          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "Run $BUILD_RUN_ID is not a successful completed build" >&2
            exit 1
          fi
          if [[ "$event" != "workflow_dispatch" && !( "$event" == "push" && "$head_branch" == "main" ) ]]; then
            echo "Run $BUILD_RUN_ID is not a manual candidate or a main-branch build" >&2
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Run $BUILD_RUN_ID has an invalid head SHA: $head_sha" >&2
            exit 1
          fi

          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Candidate run $BUILD_RUN_ID verified at $head_sha"

      - name: Checkout candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0

      - name: Download candidate artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-x64
          path: dist/public
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Validate candidate packages
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          base="MediaStationGo-${version}-windows-x64"
          expected=(
            "${base}-setup.exe"
            "${base}-portable.zip"
            "${base}-source.zip"
            "SHA256SUMS.txt"
          )

          shopt -s nullglob
          files=(dist/public/*)
          if [[ ${#files[@]} -ne ${#expected[@]} ]]; then
            echo "Expected ${#expected[@]} release files, found ${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          for name in "${expected[@]}"; do
            if [[ ! -f "dist/public/$name" ]]; then
              echo "Missing release file: $name" >&2
              exit 1
            fi
          done

          normalized_sums="$(mktemp)"
          trap 'rm -f "$normalized_sums"' EXIT
          tr -d '\r' < dist/public/SHA256SUMS.txt > "$normalized_sums"
          if [[ $(wc -l < "$normalized_sums") -ne 3 ]]; then
            echo "SHA256SUMS.txt must contain exactly three package hashes" >&2
            exit 1
          fi
          for name in "${expected[@]:0:3}"; do
            if ! grep -Eq "^[0-9a-f]{64}  ${name}$" "$normalized_sums"; then
              echo "Missing pinned hash entry for $name" >&2
              exit 1
            fi
          done
          (cd dist/public && sha256sum --check --strict "$normalized_sums")

      - name: Download optional RIFE component
        if: inputs.publish_rife_component
        uses: actions/download-artifact@v7
        with:
          name: rife-component-x64-v1
          path: dist/components
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Validate and publish optional RIFE component
        if: inputs.publish_rife_component
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('dist/components')
          asset = 'MediaStationGo-frame-interpolation-x64-v1.zip'
          if sorted(p.name for p in root.iterdir()) != [asset, 'SHA256SUMS.txt']:
              raise SystemExit('Unexpected component artifact file set')
          package = root / asset
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          if (root / 'SHA256SUMS.txt').read_text() != f'{digest}  {asset}\n':
              raise SystemExit('Component package SHA-256 mismatch')
          with zipfile.ZipFile(package) as archive:
              manifest = json.loads(archive.read('component-manifest.json'))
              expected = dict(schema=1, component='rife', version='1', platform='windows-x64', runtimeAbi=8, tensorRtVersion='1.4.0.76')
              if any(manifest.get(k) != v for k, v in expected.items()):
                  raise SystemExit('Unsupported component tuple')
              files = manifest['files']
              names = [f['path'] for f in files] + ['component-manifest.json']
              if len(names) != 16 or len(set(names)) != 16 or sorted(archive.namelist()) != sorted(names):
                  raise SystemExit('Unexpected component ZIP file set')
              for entry in files:
                  data = archive.read(entry['path'])
                  if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                      raise SystemExit(f"Component file integrity failed: {entry['path']}")
          print(f'Validated optional component: {digest}')
          PY
          component_tag=rife-component-x64-v1
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          if jq -e --arg tag "$component_tag" '.[] | select(.tag_name == $tag)' <<<"$existing" >/dev/null; then
            echo "Component release already exists; fixed component assets must not be overwritten" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$component_tag" "$CANDIDATE_SHA" -m "MediaStationGo optional RIFE component v1"
          git push origin "refs/tags/$component_tag"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          Windows x64 RTX 插帧独立组件 v1，供 MediaStationGo v1.0.7 及兼容客户端按需安装。

          - 在设置的“播放与字幕”页面下载、安装或卸载，退出所有实例后重启生效。
          - 包含三档 RIFE 模型、运行时、自有 Engine 构建助手和许可证；不包含 NVIDIA SDK CLI、Python、VapourSynth、预生成 Engine 或用户缓存。
          - 原生 ABI 8、TensorRT-RTX 1.4.0.76；需要兼容的 NVIDIA RTX 显卡与驱动。
          - 附带同一候选提交的完整源码包和组件 SHA-256 校验；客户端从 GitHub asset digest 校验下载，再逐文件校验。
          - 本 Release 标为 prerelease，仅用于组件分发，不参与主程序最新版本检测。

          Source commit: $CANDIDATE_SHA
          EOF
          gh release create "$component_tag" dist/components/* \
            "dist/public/MediaStationGo-${RELEASE_TAG#v}-windows-x64-source.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "RTX 插帧独立组件 v1" --notes-file "$notes_file"
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$component_tag")"
          expected_digest="sha256:$(sha256sum dist/components/MediaStationGo-frame-interpolation-x64-v1.zip | cut -d' ' -f1)"
          jq -e --arg digest "$expected_digest" \
            '.prerelease == true and .draft == false and ([.assets[] | select(.name == "MediaStationGo-frame-interpolation-x64-v1.zip" and .digest == $digest)] | length == 1) and (.assets | length == 3)' \
            <<<"$published" >/dev/null

      - name: Prepare release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$REPLACE_EXISTING" != "true" ]]; then
              echo "Release already exists: $RELEASE_TAG" >&2
              exit 1
            fi

            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            archive_tag="archive/${RELEASE_TAG#v}-${tagged_sha:0:7}"
            if git ls-remote --exit-code --tags origin "refs/tags/$archive_tag" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$archive_tag:refs/tags/$archive_tag"
              archive_sha="$(git rev-list -n 1 "$archive_tag")"
              if [[ "$archive_sha" != "$tagged_sha" ]]; then
                echo "Archive tag $archive_tag points to $archive_sha, expected $tagged_sha" >&2
                exit 1
              fi
            else
              git tag -a "$archive_tag" "$tagged_sha" -m "Archived $RELEASE_TAG before replacement"
              git push origin "refs/tags/$archive_tag"
            fi

            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "Replacing $RELEASE_TAG; previous target archived as $archive_tag"
            exit 0
          fi

          echo "existing=false" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tagged_sha" != "$CANDIDATE_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tagged_sha, expected $CANDIDATE_SHA" >&2
              exit 1
            fi
            echo "Using existing tag $RELEASE_TAG at $tagged_sha"
          else
            git tag -a "$RELEASE_TAG" "$CANDIDATE_SHA" -m "MediaStationGo $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EXISTING_RELEASE: ${{ steps.release.outputs.existing }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if [[ "$EXISTING_RELEASE" == "true" ]]; then
            if [[ -z "$RELEASE_NOTES" ]]; then
              echo "release_notes is required when replacing an existing release" >&2
              exit 1
            fi

            notes_file="$(mktemp)"
            trap 'rm -f "$notes_file"' EXIT
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"

            gh release upload "$RELEASE_TAG" dist/public/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --latest

            git tag -f -a "$RELEASE_TAG" "$CANDIDATE_SHA" -m "MediaStationGo $RELEASE_TAG"
            git push --force origin "refs/tags/$RELEASE_TAG"
          else
            if [[ -n "$RELEASE_NOTES" ]]; then
              notes_file="$(mktemp)"
              trap 'rm -f "$notes_file"' EXIT
              printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
              gh release create "$RELEASE_TAG" dist/public/* \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --notes-file "$notes_file" \
                --title "$RELEASE_TAG"
            else
              gh release create "$RELEASE_TAG" dist/public/* \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --generate-notes \
                --title "$RELEASE_TAG"
            fi
          fi

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tagged_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Published tag points to $tagged_sha, expected $CANDIDATE_SHA" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          expected="$(printf '%s\n' \
            "MediaStationGo-${version}-windows-x64-portable.zip" \
            "MediaStationGo-${version}-windows-x64-setup.exe" \
            "MediaStationGo-${version}-windows-x64-source.zip" \
            "SHA256SUMS.txt")"
          actual="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Published release assets do not match the expected set" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
            exit 1
          fi
