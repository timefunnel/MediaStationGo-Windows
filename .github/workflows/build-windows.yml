name: build-windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            platform: windows64
            msystem: CLANG64
            pkg_prefix: mingw-w64-clang-x86_64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\build\mediastation-cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build\mediastation-cargo
          key: windows-cargo-${{ matrix.arch }}-${{ hashFiles('src/Cargo.lock', 'src/**/Cargo.toml') }}
          restore-keys: |
            windows-cargo-${{ matrix.arch }}-

      - name: Cache RIFE build asset
        uses: actions/cache@v6
        with:
          path: .cache/frame-interpolation-runtime
          key: rife-runtime-x64-v1-c815c70350580761140f2c17ec950c5c2844d7e3e0c4484acecc1ecdb61e892f

      - name: Prepare RIFE build runtime
        shell: pwsh
        run: dev\windows\prepare_public_rife_runtime.ps1

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-${{ matrix.arch }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          cache: true
          install: >-
            ${{ matrix.pkg_prefix }}-cc
            ${{ matrix.pkg_prefix }}-clang
            ${{ matrix.pkg_prefix }}-meson
            ${{ matrix.pkg_prefix }}-pkgconf
            ${{ matrix.pkg_prefix }}-binutils
            ${{ matrix.pkg_prefix }}-nasm
            ${{ matrix.pkg_prefix }}-yasm
            ${{ matrix.pkg_prefix }}-bzip2
            ${{ matrix.pkg_prefix }}-dav1d
            ${{ matrix.pkg_prefix }}-libiconv
            ${{ matrix.pkg_prefix }}-zlib
            ${{ matrix.pkg_prefix }}-libplacebo
            ${{ matrix.pkg_prefix }}-libass
            ${{ matrix.pkg_prefix }}-vulkan-headers
            ${{ matrix.pkg_prefix }}-vulkan-loader
            ${{ matrix.pkg_prefix }}-shaderc
            ${{ matrix.pkg_prefix }}-spirv-cross
            ${{ matrix.pkg_prefix }}-llvm

      - name: Resolve native dependency cache contract
        id: native-cache-contract
        shell: pwsh
        run: |
          $MpvCommit = (git -C third_party/mpv rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $MpvCommit) {
            throw "Unable to resolve the pinned mpv submodule commit"
          }
          "mpv_commit=$MpvCommit" >> $env:GITHUB_OUTPUT

      - name: Cache native media dependencies
        uses: actions/cache@v6
        with:
          path: |
            third_party/mpv-install
            third_party/ffmpeg-38b88335f99e76ed89ff3c93f877fdefce736c13
            third_party/ffmpeg-install-38b88335f99e76ed89ff3c93f877fdefce736c13
            third_party/libplacebo-1733c8601edec161b714e4a799c72a9f5e5aa2f0.tar.gz
            third_party/libplacebo-install-1733c8601edec161b714e4a799c72a9f5e5aa2f0
          key: windows-native-deps-${{ matrix.arch }}-${{ steps.native-cache-contract.outputs.mpv_commit }}-${{ hashFiles('dev/windows/build_mpv_source.ps1', 'dev/windows/build_ffmpeg_lgpl_source.ps1', 'dev/windows/build_libplacebo_source.ps1', 'dev/windows/build_rife_runtime.ps1', 'dev/windows/stage_frame_interpolation_runtime.ps1', 'dev/windows/mpv/**', 'dev/windows/libplacebo/**', 'third_party/nvofapi/**') }}
          restore-keys: |
            windows-native-deps-${{ matrix.arch }}-${{ steps.native-cache-contract.outputs.mpv_commit }}-

      - name: Build mpv from source
        shell: pwsh
        run: dev\windows\build_mpv_source.ps1 -Arch ${{ matrix.arch }}

      - name: Build
        shell: cmd
        env:
          # bindgen (used by jfn-mpv's build.rs) dlopens libclang at
          # build time. The mingw-w64-clang-*-llvm package ships
          # libclang.dll under the msystem prefix's bin/; cmd.exe
          # doesn't pick that up from setup-msys2, so point bindgen
          # at it explicitly.
          LIBCLANG_PATH: C:\msys64\${{ matrix.msystem }}\bin
          MSYS_BIN: C:\msys64\${{ matrix.msystem }}\bin
          # mingw's libclang doesn't auto-pick the MSVC target triple, so
          # MSVC's arch-specific headers (__int64, vcruntime intrinsics,
          # etc.) get parsed against the wrong default target. Pin it.
          BINDGEN_EXTRA_CLANG_ARGS: --target=${{ matrix.triple }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" %MATRIX_ARCH% || exit /b 1
          set "PATH=%PATH%;%MSYS_BIN%"
          cargo xtask build --external-mpv "%CD%\third_party\mpv-install" --out build\mediastation-public-release

      - name: Install public packaging tools
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          cargo install cargo-about --locked --features cli
          choco install innosetup --no-progress -y

      - name: Package public Windows release
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          dev\windows\package_public_release.ps1 -SkipBuild

      - name: Upload artifact
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/public/*
          retention-days: 14
