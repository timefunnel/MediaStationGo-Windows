<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MediaStationGo</title>
  <link rel="stylesheet" href="mediastation.css">
</head>
<body>
  <section id="splash" class="splash" aria-live="polite">
    <div class="brand brand-large"><img class="brand-icon" src="mediastationgo-icon.png" alt=""><span>MediaStationGo</span></div>
    <div class="splash-line"></div>
  </section>

  <section id="login-view" class="login-view hidden" aria-labelledby="login-title">
    <header class="login-brand">
      <div class="brand brand-large"><img class="brand-icon" src="mediastationgo-icon.png" alt=""><span>MediaStationGo</span></div>
    </header>
    <main class="login-layout">
      <form id="login-form" class="login-panel" autocomplete="on">
        <p class="eyebrow">WINDOWS PLAYER</p>
        <h1 id="login-title">登录媒体服务器</h1>
        <label>服务器地址<input id="server-url" name="server" type="url" inputmode="url" placeholder="https://example.com" required></label>
        <fieldset class="login-connection-fieldset">
          <legend>服务器类型</legend>
          <div class="login-server-type" role="radiogroup" aria-label="服务器类型">
            <label><input type="radio" name="server-type" value="mediastation_go" checked><span>MediaStationGo</span></label>
            <label><input type="radio" name="server-type" value="standard_emby"><span>标准 Emby</span></label>
          </div>
        </fieldset>
        <label id="emby-client-profile-field" class="hidden">客户端身份
          <select id="emby-client-profile" name="client-profile">
            <option value="senplayer">SenPlayer</option>
            <option value="infuse">Infuse</option>
          </select>
        </label>
        <label>代理方式
          <select id="login-proxy-mode" name="proxy-mode">
            <option value="direct">直连</option>
            <option value="system">系统代理</option>
          </select>
        </label>
        <label>用户名<input id="username" name="username" autocomplete="username" required></label>
        <label>密码<input id="password" name="password" type="password" autocomplete="current-password"></label>
        <div class="login-actions">
          <button id="login-cancel" class="secondary-command hidden" type="button">取消</button>
          <button id="login-submit" class="primary-command" type="submit">
            <span class="login-submit-icon" aria-hidden="true">&#9654;</span>
            <span class="login-submit-spinner" aria-hidden="true"></span>
            <span id="login-submit-label">登录</span>
          </button>
        </div>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
      <div class="login-visual" aria-hidden="true">
        <img class="login-emblem" src="mediastationgo-icon.png" alt="">
        <div class="login-wordmark"><strong>MediaStationGo</strong><span>Windows Player</span></div>
      </div>
    </main>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <div id="app-backdrop" class="app-backdrop" aria-hidden="true">
      <span class="app-backdrop-layer"></span>
      <span class="app-backdrop-layer"></span>
    </div>
    <header class="topbar">
      <button id="brand-home" class="brand brand-button" type="button" title="返回首页" data-focus-key="top:brand"><img class="brand-icon" src="mediastationgo-icon.png" alt=""><span>MediaStationGo</span></button>
      <button id="topbar-home-shortcut" class="icon-button topbar-home-shortcut hidden" type="button" title="返回首页" aria-label="返回首页" data-focus-key="top:home-shortcut"><span aria-hidden="true">⌂</span></button>
      <nav class="top-nav" aria-label="主导航">
        <button id="nav-home" class="nav-command active" type="button" data-focus-key="top:nav-home">首页</button>
        <button id="nav-library" class="nav-command" type="button" data-focus-key="top:nav-library">媒体库</button>
      </nav>
      <div class="top-actions">
        <button id="search-open" class="icon-button" type="button" title="搜索" aria-label="搜索" data-focus-key="top:search"><span class="search-glyph" aria-hidden="true"></span></button>
        <button id="account-open" class="account-button" type="button" title="账号" data-focus-key="top:account"><span id="account-avatar" aria-hidden="true">M</span><span id="account-name"></span></button>
        <button id="settings-open" class="icon-button" type="button" title="设置" aria-label="设置" data-focus-key="top:settings"><span class="symbol-icon" aria-hidden="true">&#x2699;&#xFE0E;</span></button>
      </div>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
    <button id="content-to-top" class="icon-button hero-carousel-button content-to-top hidden" type="button" title="回到顶部" aria-label="回到顶部">
      <span class="hero-carousel-chevron" aria-hidden="true"></span>
    </button>
  </div>

  <section id="player-view" class="player-view hidden" aria-label="播放器">
    <div id="player-poster" class="player-poster" aria-hidden="true"><img alt=""></div>
    <div id="player-loading" class="player-loading">
      <div class="player-loading-emblem" aria-hidden="true">
        <span class="player-loading-glow"></span>
        <span class="player-loading-orbit"></span>
        <span class="player-loading-orbit player-loading-orbit-inner"></span>
        <span class="player-loading-core"></span>
      </div>
      <div class="player-loading-copy">
        <strong id="player-loading-title"></strong>
        <p id="player-loading-label">正在准备播放</p>
      </div>
      <div class="player-loading-track"><span class="player-loading-bar"></span></div>
    </div>
    <div id="player-controls" class="player-controls visible">
      <div class="player-topline">
        <button id="player-exit" class="icon-button hero-carousel-button hero-carousel-previous" type="button" title="退出播放" aria-label="退出播放"><span class="hero-carousel-chevron" aria-hidden="true"></span></button>
      </div>
      <div id="player-feedback" class="player-feedback hidden" aria-hidden="true"><span></span></div>
      <div class="player-bottom">
        <div class="player-heading"><strong id="player-title"></strong><span id="player-subtitle"></span></div>
        <div class="player-timeline">
          <span id="player-current">00:00</span>
          <input id="player-progress" type="range" min="0" max="1000" value="0" aria-label="播放进度">
          <span id="player-duration">00:00</span>
        </div>
        <div class="player-tools" role="toolbar" aria-label="播放选项">
          <div class="player-tools-primary">
            <button id="player-episodes" class="icon-button control-button player-episodes hidden" type="button" title="选集" aria-label="选集" aria-pressed="false"><span aria-hidden="true"><i></i><i></i><i></i></span></button>
            <button id="player-interpolation" class="icon-button control-button player-interpolation" type="button" title="RTX 插帧" aria-label="RTX 插帧" aria-pressed="false"><span aria-hidden="true"><i></i><i></i><i></i></span></button>
            <div class="player-volume-control">
              <button id="player-volume-toggle" class="icon-button control-button player-volume-toggle" type="button" title="静音" aria-label="静音" aria-pressed="false"><span class="player-volume-glyph" aria-hidden="true"></span></button>
              <input id="player-volume" type="range" min="0" max="100" step="1" value="100" aria-label="播放器音量">
              <output id="player-volume-value" for="player-volume">100</output>
            </div>
          </div>
          <button id="player-playback" class="icon-button control-button player-playback" type="button" title="暂停" aria-label="暂停"><span aria-hidden="true">&#x23F8;&#xFE0E;</span></button>
          <div class="player-tools-secondary">
            <button id="player-speed" class="icon-button control-button player-speed" type="button" title="播放速度：1×" aria-label="播放速度：1×" aria-pressed="false"><span aria-hidden="true">1×</span></button>
            <button id="player-subtitles" class="icon-button control-button" type="button" title="字幕" aria-label="字幕"><span aria-hidden="true">CC</span></button>
            <button id="player-audio" class="icon-button control-button" type="button" title="音轨" aria-label="音轨"><span aria-hidden="true">&#9835;</span></button>
            <button id="player-info" class="icon-button control-button" type="button" title="播放信息" aria-label="播放信息"><span aria-hidden="true">&#9432;</span></button>
            <button id="player-fullscreen" class="icon-button control-button player-fullscreen" type="button" title="进入全屏" aria-label="进入全屏" aria-pressed="false"><span aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
          </div>
        </div>
      </div>
      <section id="player-panel" class="player-panel hidden" aria-label="播放选项面板">
        <header><h2 id="player-panel-title"></h2></header>
        <div id="player-panel-content" class="player-panel-content"></div>
      </section>
    </div>
  </section>

  <div id="drawer-scrim" class="drawer-scrim hidden"></div>
  <aside id="account-drawer" class="drawer" aria-hidden="true">
    <header><h2>账号</h2><button class="icon-button drawer-close" type="button" title="关闭" aria-label="关闭">&#10005;</button></header>
    <div class="drawer-body">
      <div class="account-summary"><span id="drawer-avatar" aria-hidden="true">M</span><div><strong id="drawer-user"></strong><p id="drawer-server"></p></div></div>
      <section id="saved-accounts" class="saved-accounts" aria-label="已保存账号">
        <h3>已保存账号</h3>
        <p id="saved-accounts-state" class="saved-accounts-state" role="status" aria-live="polite">正在读取账号...</p>
        <div id="saved-accounts-list" class="saved-accounts-list"></div>
      </section>
      <button id="change-account-button" class="secondary-command drawer-command" type="button">添加账号</button>
    </div>
  </aside>
  <div id="account-delete-scrim" class="modal-scrim hidden">
    <section id="account-delete-dialog" class="account-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="account-delete-title">
      <header>
        <h2 id="account-delete-title">删除账号</h2>
        <button id="account-delete-close" class="icon-button" type="button" title="关闭" aria-label="关闭">&#10005;</button>
      </header>
      <div class="account-delete-body">
        <p id="account-delete-message"></p>
        <div class="account-delete-actions">
          <button id="account-delete-cancel" class="secondary-command" type="button">取消</button>
          <button id="account-delete-confirm" class="danger-command" type="button">删除账号</button>
        </div>
      </div>
    </section>
  </div>
  <aside id="settings-drawer" class="drawer" aria-hidden="true">
    <header><h2>设置</h2><button class="icon-button drawer-close" type="button" title="关闭" aria-label="关闭">&#10005;</button></header>
    <div class="drawer-body settings-list">
      <section class="setting-block update-settings">
        <div class="setting-toggle-row">
          <label for="auto-update-check">自动检查更新</label>
          <input id="auto-update-check" type="checkbox" role="switch">
        </div>
        <p id="app-update-status" class="component-status" role="status" aria-live="polite">尚未检查更新</p>
        <div class="setting-actions">
          <button id="check-app-update" class="secondary-command" type="button">检查更新</button>
          <button id="download-app-update" class="primary-command hidden" type="button">下载更新</button>
          <button id="install-app-update" class="primary-command hidden" type="button">安装更新</button>
        </div>
        <div id="confirm-app-update" class="update-confirm hidden">
          <p>安装更新会关闭当前应用，是否继续？</p>
          <div class="setting-actions">
            <button id="cancel-app-update" class="secondary-command" type="button">取消</button>
            <button id="confirm-install-app-update" class="danger-command" type="button">确认安装</button>
          </div>
        </div>
      </section>
      <section class="setting-block default-subtitle-settings">
        <h3>默认字幕样式</h3>
        <p>未单独调整过的影片和剧集使用这套样式；距底部数值越大，字幕位置越高。</p>
        <label class="setting-range-row" for="default-subtitle-font-size">
          <span>文字大小</span>
          <input id="default-subtitle-font-size" type="range" min="24" max="64" step="1">
          <output id="default-subtitle-font-size-value" for="default-subtitle-font-size"></output>
        </label>
        <label class="setting-range-row" for="default-subtitle-bottom-offset">
          <span>距底部</span>
          <input id="default-subtitle-bottom-offset" type="range" min="0" max="30" step="1">
          <output id="default-subtitle-bottom-offset-value" for="default-subtitle-bottom-offset"></output>
        </label>
        <button id="reset-default-subtitle-style" class="secondary-command" type="button">恢复推荐值</button>
      </section>
      <section class="setting-block">
        <h3>RTX 插帧组件</h3>
        <p id="frame-interpolation-status" class="component-status">正在检测组件</p>
      </section>
      <section><h3>图片缓存</h3><p id="image-cache-status">0 张图片</p><button id="clear-image-cache" class="secondary-command" type="button">清除图片缓存</button></section>
    </div>
  </aside>

  <div id="overview-scrim" class="modal-scrim hidden">
    <section id="overview-dialog" class="reading-panel" role="dialog" aria-modal="true" aria-labelledby="overview-title">
      <header><h2 id="overview-title"></h2><button id="overview-close" class="icon-button" type="button" title="关闭" aria-label="关闭">&#10005;</button></header>
      <p id="overview-body"></p>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="mediastation.js"></script>
</body>
</html>
