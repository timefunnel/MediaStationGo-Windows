[package]
name = "jfn-danmaku"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "jfn_danmaku"

[features]
# Enables the mpv backed session (`DanmakuSession`). Off by default so the
# layout engine keeps zero dependencies.
mpv = ["dep:jfn-mpv"]

[dependencies]
jfn-mpv = { path = "../mpv", optional = true }
tempfile.workspace = true

[lints]
workspace = true
